spring:
  application:
    name: gerenciador-tarefas-api

  # Conexão via variáveis de ambiente (no Azure: App Settings / Key Vault references)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gerenciador_tarefas}
    username: ${DB_USERNAME:gerenciador}
    password: ${DB_PASSWORD:gerenciador}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

app:
  cors:
    # Origens liberadas para chamar a API (separadas por vírgula).
    # Adicione aqui a URL do frontend quando ele for publicado. A variável CORS_ALLOWED_ORIGINS, se definida, substitui esta lista.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness e /readiness (Azure Container Apps)

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
